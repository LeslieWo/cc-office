<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CC Office</title>
<style>
  :root {
    --floor:#1b1a17; --floor2:#232019; --wall:#12110f;
    --wood:#3d3428; --wood-top:#4a4032; --edge:#0d0c0a;
    --ink:#f4efe4; --dim:#a09585; --faint:#6d6558;
    --green:#7bc47f; --amber:#efb45a; --red:#e2705f;
    --bubble:#fbf6ea; --bubble-ink:#2a251d;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; color:var(--ink);
    background:
      radial-gradient(120% 80% at 50% -10%, #2b2721 0%, transparent 60%),
      linear-gradient(180deg, var(--wall) 0 90px, var(--floor) 90px 100%);
    font:15px/1.55 ui-rounded,"SF Pro Rounded","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header {
    height:90px; display:flex; align-items:center; gap:18px;
    padding:0 26px; border-bottom:1px solid #000;
    background:linear-gradient(180deg,#181613,#12110f);
  }
  h1 { font-size:19px; margin:0; letter-spacing:.4px; font-weight:600; }
  h1 .sub { color:var(--faint); font-size:12px; font-weight:400; display:block; margin-top:3px; letter-spacing:0; }
  .counts { margin-left:auto; display:flex; gap:10px; }
  .pill {
    display:flex; align-items:center; gap:7px; padding:7px 14px; border-radius:999px;
    background:#221f1b; border:1px solid #2e2a24; font-size:13px; color:var(--dim);
  }
  .pill b { color:var(--ink); font-weight:600; }
  .pill.hot { background:#3a2a1b; border-color:#6b4a24; color:#ffd9a0; }
  .dot { width:8px; height:8px; border-radius:50%; }
  .dot.working { background:var(--green); }
  .dot.waiting { background:var(--amber); }
  .dot.stalled { background:var(--red); }

  main {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
    gap:46px 30px; padding:64px 30px 80px; max-width:1500px; margin:0 auto;
    align-items:start;
  }

  /* one desk = bubble on top, character, desk slab, task underneath */
  .desk { display:flex; flex-direction:column; align-items:center; min-width:0; }
  .bubble, .task, .name { overflow-wrap:anywhere; }

  .bubble {
    position:relative; max-width:100%; background:var(--bubble); color:var(--bubble-ink);
    border-radius:16px; padding:11px 14px; font-size:13px; line-height:1.45;
    box-shadow:0 6px 18px rgba(0,0,0,.45); margin-bottom:13px;
    display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
  }
  .bubble::after {
    content:""; position:absolute; bottom:-7px; left:50%; margin-left:-7px;
    border:7px solid transparent; border-top-color:var(--bubble); border-bottom:0;
  }
  .bubble.tool { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; background:#e9e2d2; }
  .bubble.quiet { background:#2a2621; color:var(--faint); box-shadow:none; }
  .bubble.quiet::after { border-top-color:#2a2621; }

  .guy { position:relative; cursor:pointer; }
  .avatar {
    width:66px; height:66px; border-radius:50%; display:grid; place-items:center;
    font-size:34px; background:#2c2822; border:2px solid #3a352d;
    transition:transform .15s ease;
  }
  .guy:hover .avatar { transform:translateY(-3px); }
  .badge {
    position:absolute; right:-2px; bottom:-2px; width:16px; height:16px; border-radius:50%;
    border:3px solid var(--floor);
  }
  .badge.working { background:var(--green); animation:pulse 1.6s ease-in-out infinite; }
  .badge.waiting { background:var(--amber); }
  .badge.stalled { background:var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  .slab {
    width:190px; height:16px; margin-top:-8px; border-radius:5px 5px 3px 3px;
    background:linear-gradient(180deg,var(--wood-top),var(--wood));
    box-shadow:0 3px 0 var(--edge), 0 16px 26px rgba(0,0,0,.5);
  }
  .name {
    margin-top:14px; font-size:15px; font-weight:600; letter-spacing:.2px;
    text-align:center; max-width:280px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    overflow-wrap:anywhere;
  }
  .name .tag { color:var(--faint); font-weight:400; font-size:11px; margin-left:6px; font-family:ui-monospace,Menlo,monospace; }
  .task {
    margin-top:5px; font-size:12.5px; color:var(--dim); text-align:center; max-width:270px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .meta { margin-top:7px; font-size:11px; color:var(--faint); display:flex; gap:9px; }

  .interns { margin-top:9px; display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .intern {
    font-size:11px; padding:3px 9px; border-radius:999px;
    background:#26313a; border:1px solid #35434f; color:#a8cbe0;
  }
  .intern::before { content:"⚙ "; }

  .desk.waiting .avatar { border-color:#8a6a2e; box-shadow:0 0 0 5px rgba(239,180,90,.14); }
  .desk.stalled .avatar { border-color:#7a3a30; box-shadow:0 0 0 5px rgba(226,112,95,.13); }

  .empty { grid-column:1/-1; text-align:center; color:var(--faint); padding:90px 0; }
  footer { text-align:center; color:var(--faint); font-size:11.5px; padding-bottom:34px; }

  dialog {
    border:1px solid #3a352d; border-radius:16px; background:#211e1a; color:var(--ink);
    padding:22px; width:330px; box-shadow:0 24px 60px rgba(0,0,0,.6);
  }
  dialog::backdrop { background:rgba(0,0,0,.55); }
  dialog h3 { margin:0 0 4px; font-size:16px; }
  dialog p { margin:0 0 16px; font-size:12px; color:var(--faint); }
  dialog input {
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid #3a352d;
    background:#191713; color:var(--ink); font:inherit; font-size:14px;
  }
  .faces { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 18px; }
  .faces button {
    width:38px; height:38px; border-radius:10px; font-size:20px; cursor:pointer;
    background:#191713; border:1px solid #302c26; color:inherit;
  }
  .faces button[aria-pressed="true"] { border-color:var(--amber); background:#2e2519; }
  .row { display:flex; gap:8px; }
  .row button {
    flex:1; padding:10px; border-radius:10px; cursor:pointer; font:inherit; font-size:14px;
    border:1px solid #3a352d; background:#2b2721; color:var(--ink);
  }
  .row button.go { background:#5d4a2a; border-color:#7a6236; color:#ffe6bd; }
</style>
</head>
<body>

<header>
  <h1>CC Office<span class="sub">every Claude Code window you have open</span></h1>
  <div class="counts" id="counts"></div>
</header>

<main id="floor"></main>
<footer id="foot"></footer>

<dialog id="editor">
  <h3>Name this window</h3>
  <p id="editor-sub"></p>
  <input id="nameInput" placeholder="e.g. data analysis" maxlength="24" autocomplete="off">
  <div class="faces" id="faces"></div>
  <div class="row">
    <button id="clearBtn">Reset</button>
    <button id="saveBtn" class="go">Save</button>
  </div>
</dialog>

<script>
const FACES = ["🐧","🦊","🐢","🐙","🦉","🐻","🐳","🦁","🐸","🦩","🐺","🦭","🐝","🦌","🐨","🦔"];
const LABEL = { working:"working", waiting:"waiting on you", stalled:"maybe stuck" };
let editing = null, pickedFace = "";

function ago(s) {
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  const h = Math.floor(s / 3600);
  return h < 24 ? h + "h" : Math.floor(h / 24) + "d";
}
const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function render(data) {
  const floor = document.getElementById("floor");
  const n = { working:0, waiting:0, stalled:0 };
  data.people.forEach(p => n[p.state]++);

  document.getElementById("counts").innerHTML =
    (n.waiting ? `<span class="pill hot"><span class="dot waiting"></span><b>${n.waiting}</b> waiting on you</span>` : "") +
    (n.stalled ? `<span class="pill hot"><span class="dot stalled"></span><b>${n.stalled}</b> maybe stuck</span>` : "") +
    `<span class="pill"><span class="dot working"></span><b>${n.working}</b> working</span>`;

  if (!data.people.length) {
    floor.innerHTML = `<div class="empty">Office is empty — no Claude Code windows open.</div>`;
  } else {
    floor.innerHTML = data.people.map(p => {
      const quiet = !p.bubble;
      const bubbleTxt = p.bubble || "……";
      const cls = quiet ? "quiet" : (p.bubble_kind === "tool" ? "tool" : "");
      const title = p.name || p.task || "(no job yet)";
      return `
      <div class="desk ${p.state}">
        <div class="bubble ${cls}">${esc(bubbleTxt)}</div>
        <div class="guy" data-sid="${p.sid}" data-name="${esc(p.name)}" data-avatar="${p.avatar}" title="click to rename">
          <div class="avatar">${p.avatar}</div>
          <div class="badge ${p.state}"></div>
        </div>
        <div class="slab"></div>
        <div class="name">${esc(title)}<span class="tag">${p.pid}</span></div>
        ${p.name && p.task ? `<div class="task">${esc(p.task)}</div>` : ""}
        ${p.reply && p.reply !== title && p.reply !== p.task
            ? `<div class="task">You last said: ${esc(p.reply)}</div>` : ""}
        <div class="meta"><span>${LABEL[p.state]}</span><span>up ${ago(p.uptime)}</span><span>${p.cwd}</span></div>
        ${p.interns.length ? `<div class="interns">${p.interns.map(i =>
            `<span class="intern">${esc(i.who)} is running: ${esc(i.doing)}</span>`).join("")}</div>` : ""}
      </div>`;
    }).join("");
  }

  document.getElementById("foot").textContent =
    "Refreshes every 2s. Read-only. Click a face to rename.";
  document.querySelectorAll(".guy").forEach(g => g.onclick = () => openEditor(g.dataset));
}

function openEditor(d) {
  editing = d.sid;
  pickedFace = d.avatar;
  document.getElementById("editor-sub").textContent = "Session " + d.sid.slice(0, 8);
  document.getElementById("nameInput").value = d.name || "";
  document.getElementById("faces").innerHTML = FACES.map(f =>
    `<button data-f="${f}" aria-pressed="${f === pickedFace}">${f}</button>`).join("");
  document.querySelectorAll("#faces button").forEach(b => b.onclick = () => {
    pickedFace = b.dataset.f;
    document.querySelectorAll("#faces button").forEach(x =>
      x.setAttribute("aria-pressed", x.dataset.f === pickedFace));
  });
  document.getElementById("editor").showModal();
  document.getElementById("nameInput").focus();
}

async function saveName(name, avatar) {
  await fetch("/api/name", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sid: editing, name, avatar })
  });
  document.getElementById("editor").close();
  tick();
}
document.getElementById("saveBtn").onclick = () =>
  saveName(document.getElementById("nameInput").value.trim(), pickedFace);
document.getElementById("clearBtn").onclick = () => saveName("", "");
document.getElementById("nameInput").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("saveBtn").click();
});

async function tick() {
  try {
    const r = await fetch("/api/office", { cache: "no-store" });
    render(await r.json());
  } catch (e) {
    document.getElementById("foot").textContent = "Can't reach server.py — did it stop?";
  }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
